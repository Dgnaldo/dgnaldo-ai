<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dgnaldo AI · NEU EP01</title>
<meta name="theme-color" content="#0b0f17">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0b0f17; --ink2:#141a26; --ink3:#1d2533; --line:#2a3344;
  --cream:#fdf5ec; --muted:#9aa3b2; --accent:#d97757; --accent2:#f0a585;
  --blue:#4d7591; --good:#6fcf97; --gold:#f2c94c; --silver:#cfd6e0; --bronze:#d9925b;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--ink);color:var(--cream);font-family:"Be Vietnam Pro",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.serif{font-family:"Playfair Display",Georgia,serif;font-style:italic;font-weight:500}
button{font:inherit;cursor:pointer;border:0}
.btn{background:var(--cream);color:var(--ink);padding:14px 26px;border-radius:999px;font-weight:600;font-size:16px;transition:transform .15s,opacity .15s}
.btn:hover{transform:translateY(-2px)}
.btn:disabled{opacity:.4;transform:none;cursor:default}
.btn.acc{background:var(--accent);color:#fff}
.btn.ghost{background:transparent;color:var(--cream);border:1px solid var(--line)}
.btn.sm{padding:8px 16px;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;color:var(--muted)}
.pill b{color:var(--cream);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 12px var(--good)}

/* ---------- HOST ---------- */
.host{min-height:100vh;display:flex;flex-direction:column;padding:28px 48px 36px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;letter-spacing:.04em;font-size:15px}
.brand .hex{width:22px;height:22px;background:var(--cream);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;padding-top:20px}
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:56px;align-items:center}
.h1{font-size:clamp(56px,7.5vw,118px);line-height:.95;font-weight:500;letter-spacing:-.03em}
.h1 .serif{color:var(--accent2)}
.lead{font-size:20px;color:var(--muted);margin-top:22px;max-width:620px;line-height:1.55}
.steps{display:flex;gap:14px;margin-top:30px;flex-wrap:wrap}
.step{background:var(--ink2);border:1px solid var(--line);border-radius:18px;padding:14px 18px;font-size:14px;color:var(--muted);flex:1;min-width:150px}
.step b{display:block;color:var(--cream);font-size:15px;margin-bottom:4px}
.joincard{background:var(--cream);color:var(--ink);border-radius:28px;padding:28px;display:flex;flex-direction:column;align-items:center;gap:16px}
#qr{background:#fff;padding:12px;border-radius:16px}
#qr img,#qr canvas{display:block;width:240px;height:240px}
.joincard .lbl{font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:#6b7280}
.joincard .url{font-size:12px;color:#4b5563;word-break:break-all;text-align:center;max-width:300px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px;min-height:40px}
.chip{background:var(--ink3);border:1px solid var(--line);padding:8px 14px;border-radius:999px;font-size:14px;animation:pop .35s ease}
.chip.done{background:rgba(111,207,151,.12);border-color:rgba(111,207,151,.5)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.controls{display:flex;gap:12px;align-items:center;margin-top:30px;flex-wrap:wrap}

.challenge{display:grid;grid-template-columns:1fr 300px;gap:56px;align-items:center}
.rlabel{font-size:14px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent2);font-weight:600}
.task{font-size:clamp(34px,4.2vw,62px);line-height:1.12;font-weight:500;letter-spacing:-.02em;margin-top:16px}
.hint{margin-top:22px;color:var(--muted);font-size:18px}
.ring{position:relative;width:300px;height:300px}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num b{font-size:84px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.ring .num span{color:var(--muted);font-size:14px}
.counter{font-size:18px;color:var(--muted);margin-top:26px}
.counter b{color:var(--cream);font-size:28px}

.grading{display:flex;flex-direction:column;align-items:center;text-align:center;gap:26px}
.spark{width:110px;height:110px;color:var(--accent);animation:spin 2.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.gradelog{font-size:16px;color:var(--muted);min-height:24px}

.results{display:grid;grid-template-columns:1fr 380px;gap:40px;align-items:start}
.rank{display:flex;flex-direction:column;gap:10px;max-height:66vh;overflow:auto;padding-right:6px}
.row{display:grid;grid-template-columns:44px 1fr 90px;gap:14px;align-items:center;background:var(--ink2);border:1px solid var(--line);border-radius:18px;padding:14px 18px;opacity:0;transform:translateX(-30px);animation:slide .5s ease forwards;cursor:pointer}
.row:hover{border-color:var(--accent)}
@keyframes slide{to{opacity:1;transform:none}}
.row .pos{font-size:22px;font-weight:700;color:var(--muted);text-align:center}
.row.p1{border-color:var(--gold);background:linear-gradient(90deg,rgba(242,201,76,.14),var(--ink2))}
.row.p1 .pos{color:var(--gold)} .row.p2 .pos{color:var(--silver)} .row.p3 .pos{color:var(--bronze)}
.row .nm{font-weight:600;font-size:18px}
.row .cm{font-size:14px;color:var(--muted);margin-top:4px;line-height:1.4}
.row .sc{font-size:30px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.bars{display:flex;gap:4px;margin-top:8px}
.bars i{height:5px;border-radius:3px;background:var(--line);flex:1;position:relative;overflow:hidden}
.bars i::after{content:"";position:absolute;inset:0;width:var(--w);background:var(--accent)}
.side{background:var(--ink2);border:1px solid var(--line);border-radius:22px;padding:22px;position:sticky;top:20px}
.side h3{font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:14px;font-weight:600}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px;color:var(--muted)}
.legend b{color:var(--cream)}
.runbox{margin-top:18px;background:var(--ink);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:14px;line-height:1.55;max-height:36vh;overflow:auto;white-space:pre-wrap;color:#dfe4ec}
.runbox .q{color:var(--accent2);font-size:13px;margin-bottom:8px;display:block}

.podium{display:flex;align-items:flex-end;justify-content:center;gap:22px;margin:20px 0 18px}
.pod{display:flex;flex-direction:column;align-items:center;gap:12px;width:230px}
.pod .who{font-size:22px;font-weight:700;text-align:center}
.pod .pts{color:var(--muted)}
.pod .blk{width:100%;border-radius:20px 20px 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:16px;font-size:54px;font-weight:800;color:var(--ink)}
.pod.g .blk{height:190px;background:var(--gold)} .pod.s .blk{height:135px;background:var(--silver)} .pod.b .blk{height:95px;background:var(--bronze)}
.pod{opacity:0;animation:rise .8s ease forwards}
.pod.b{animation-delay:.3s}.pod.s{animation-delay:1s}.pod.g{animation-delay:1.8s}
@keyframes rise{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:none}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.modal{position:fixed;inset:0;background:rgba(5,8,12,.75);display:flex;align-items:center;justify-content:center;z-index:40;padding:24px}
.modal .card{background:var(--ink2);border:1px solid var(--line);border-radius:22px;max-width:720px;width:100%;padding:28px;max-height:85vh;overflow:auto}
.modal pre{white-space:pre-wrap;font-family:inherit;font-size:17px;line-height:1.6;margin:14px 0 20px;color:#e6eaf0}
.foot{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;margin-top:22px}

/* ---------- PLAYER ---------- */
.ply{min-height:100vh;display:flex;flex-direction:column;padding:20px 20px 28px;max-width:560px;margin:0 auto}
.ply .top{font-size:13px}
.pbody{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:20px 0}
.ph{font-size:40px;line-height:1.05;font-weight:500;letter-spacing:-.02em}
.ph .serif{color:var(--accent2)}
.pp{color:var(--muted);font-size:16px;line-height:1.5}
input.txt,textarea{width:100%;background:var(--ink2);border:1px solid var(--line);color:var(--cream);border-radius:16px;padding:16px;font:inherit;font-size:17px;outline:none}
input.txt:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:190px;resize:vertical;line-height:1.5}
.ptask{background:var(--ink2);border:1px solid var(--line);border-radius:18px;padding:18px;font-size:19px;line-height:1.4;font-weight:500}
.prow{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:14px}
.ptimer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--cream);font-size:18px}
.ply .btn{width:100%;padding:17px;font-size:17px}
.big{font-size:88px;font-weight:700;letter-spacing:-.04em;line-height:1}
.scard{background:var(--cream);color:var(--ink);border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:12px}
.scard .pp{color:#4b5563}
.parts{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:14px}
.parts div{background:#f1e7da;border-radius:12px;padding:10px 12px}
.parts b{display:block;font-size:20px}
.center{text-align:center;align-items:center}
.wait-dots span{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--accent);margin:0 4px;animation:b 1.2s infinite}
.wait-dots span:nth-child(2){animation-delay:.2s}.wait-dots span:nth-child(3){animation-delay:.4s}
@keyframes b{0%,80%,100%{transform:scale(.5);opacity:.4}40%{transform:scale(1);opacity:1}}
.err{background:#2a1717;border:1px solid #6b2b2b;color:#f3c0c0;border-radius:14px;padding:14px;font-size:14px}
@media (max-width:900px){
  .host{padding:20px}
  .hero,.challenge,.results{grid-template-columns:1fr}
  .ring{width:220px;height:220px}
}

/* ---- quiz-style lobby ---- */
.lobby{display:grid;grid-template-columns:auto 1fr;gap:56px;align-items:start}
.lobby .joincard{padding:30px 34px}
#qr img,#qr canvas{width:300px!important;height:300px!important}
.roomcode{font-size:44px;font-weight:800;letter-spacing:.12em;color:var(--ink);margin-top:-8px}
.lobbyside{display:flex;flex-direction:column;min-height:480px}
.pcount{display:flex;align-items:baseline;gap:12px;margin-top:26px}
.pcount b{font-size:72px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.pcount span{color:var(--muted);font-size:18px}
.tiles{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px;align-content:flex-start;max-height:44vh;overflow:auto}
.tile{background:var(--cream);color:var(--ink);font-weight:700;font-size:18px;padding:12px 20px;border-radius:14px;animation:tilein .45s cubic-bezier(.2,1.4,.4,1)}
.tiles.small .tile{font-size:15px;padding:8px 14px;background:var(--ink3);color:var(--cream);border:1px solid var(--line);font-weight:600}
.tiles.small .tile.done{background:rgba(111,207,151,.15);border-color:rgba(111,207,151,.6)}
@keyframes tilein{0%{transform:scale(.3) translateY(20px);opacity:0}100%{transform:none;opacity:1}}
.btn.big{padding:20px 46px;font-size:22px}
.lobbyside .controls{margin-top:auto;padding-top:26px}
@media (max-width:900px){.lobby{grid-template-columns:1fr}}
.task.sm{font-size:clamp(24px,2.5vw,38px)}
.aibox{margin-top:18px;background:var(--ink2);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:16px;padding:18px 22px;font-size:clamp(18px,1.6vw,24px);line-height:1.5;color:#dfe4ec;max-width:900px}
.aibox .albl{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent2);margin-bottom:8px;font-weight:600}
.aibox.p{margin-top:0;font-size:15px;padding:14px 16px}
.lesson{background:linear-gradient(135deg,rgba(217,119,87,.18),rgba(217,119,87,.05));border:1px solid rgba(217,119,87,.45);border-radius:16px;padding:16px 18px;font-size:16px;line-height:1.5;color:var(--cream)}
.lesson .lt{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent2);font-weight:700;margin-bottom:6px}
.lesson.p{font-size:15px}
.skills{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:6px 0 18px}
.skills span{background:var(--ink2);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:15px;color:var(--cream)}
</style>
</head>
<body>
<div id="app"></div>
<canvas id="fx"></canvas>
<script src="qrcode.min.js"></script>
<script src="mqtt.min.js"></script>
<script src="app.js?v=7"></script>
</body>
</html>
